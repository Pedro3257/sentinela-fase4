name: Testes e instalação

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar núcleo
        run: python -m pip install .
      - name: Testes automatizados
        run: python -m unittest discover -s tests -v
      - name: Verificar entrega e pacote instalado
        run: python scripts/verificar_entrega.py
